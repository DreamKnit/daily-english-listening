name: Build Android APK & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库源码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 配置 Flutter 最新稳定版环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. 自动补全 Android 原生工程目录并拉取依赖
        run: |
          flutter create --platforms=android --org com.dreamknit.english .
          flutter pub get

      - name: 5. 编译构建 Release APK 安装包
        run: flutter build apk --release

      - name: 6. 上传 APK 到 Actions 产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: daily-english-listening-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 7. 自动发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "v0.1.0 - 每日英语听力 MVP 首个安卓预览版"
          body_path: CHANGELOG.md
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
