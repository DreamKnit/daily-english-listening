name: Build Android APK & Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库源码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 配置 Flutter 最新稳定版环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. 生成 Android 工程并保护自定义源码与注入权限
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create --platforms=android --org com.dreamknit.english .
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart
          # 注入 Android 网络权限与 Android 11+ TTS 语音服务查询权限
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: 5. 编译构建 Release APK 安装包
        run: flutter build apk --release

      - name: 6. 发布 APK 到当前版本 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "每日英语听力 ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
